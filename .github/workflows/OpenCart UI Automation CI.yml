name: OpenCart UI Automation CI

on:
  push:
    branches: [ master, ci-testing ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
env:
  JAVA_VERSION: '17'
  APP_URL: 'https://tutorialsninja.com/demo/'

jobs:

  # JOB 1: BUILD
  build:
    name: Build & Compile
    runs-on: ubuntu-latest
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Compile project
        run: mvn clean compile test-compile -B --no-transfer-progress

  #  JOB 2: CHROME TESTS
  test-chrome:
    name: Tests — Chrome
    runs-on: ubuntu-latest
    needs: build

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Restore Maven cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Start Selenium Grid
        run: |
             docker compose -f docker-compose.yaml up -d

      - name: Wait for Selenium Grid
        run: |
          echo "Waiting for Selenium Grid..."
          for i in {1..20}; do
            STATUS=$(curl -s http://localhost:4444/status 2>/dev/null || echo "{}")
            if echo "$STATUS" | grep -q '"ready": true'; then
              echo "Grid is ready"
              break
            fi
            echo "Waiting..."
            sleep 5
          done
          curl -sf http://localhost:4444/status | grep -q '"ready": true' \
            || (echo "Grid not ready" && exit 1)

      - name: Inject test credentials
        run: |
          cat >> src/test/resources/config.properties << EOF
          username=${{ secrets.APP_USERNAME }}
          password=${{ secrets.APP_PASSWORD }}
          email=${{ secrets.APP_USERNAME }}
          execution_env=remote
          EOF

      - name: Prepare output directories
        run: mkdir -p reports screenshots




      - name: Run UI Tests — Chrome
        timeout-minutes: 30
        run: |
          mvn clean test -B --no-transfer-progress \
            -DsuiteXmlFile=testng-chrome.xml \
            -Dexecution_env=remote \
        continue-on-error: true



      - name: Stop Selenium Grid
        if: always()
        run: docker compose -f docker-compose.yaml down --volumes

      - name: Upload Extent Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-report-chrome-${{ github.run_number }}
          path: reports/
          retention-days: 30

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-chrome-${{ github.run_number }}
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Surefire Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-chrome-${{ github.run_number }}
          path: target/surefire-reports/
          if-no-files-found: ignore

      - name: Publish Test Results Summary
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: TestNG Results — Chrome
          path: target/surefire-reports/TEST-*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Fail job if tests failed
        if: failure()
        run: exit 1

  # JOB 3: FIREFOX TESTS
  test-firefox:
    name: Tests — Firefox
    runs-on: ubuntu-latest
    needs: build

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

